<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>บริการลูกค้า</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
    }
    .profile {
      display: flex;
      align-items: center;
      padding: 20px;
      background: #fff;
      margin-bottom: 10px;
    }
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #4c91f7;
      margin-right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
    }
    .name { font-size: 16px; font-weight: 700; }
    .desc { font-size: 14px; color: #888; margin-top: 4px; }
    .btn-wrap { display: flex; justify-content: center; margin: 16px 0; }
    .primary-btn {
      background: #4c91f7;
      color: #fff;
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      font-size: 14px;
      cursor: pointer;
    }
    .section { background: #fff; margin-bottom: 10px; }
    .section-title {
      padding: 15px;
      font-size: 16px;
      border-bottom: 1px solid #eee;
    }
    .list-item {
      display: flex;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    .list-item:last-child { border-bottom: none; }
    .arrow { margin-left: auto; color: #888; }
  </style>
</head>
<body>
  <div class="profile">
    <div class="avatar">CS</div>
    <div>
      <div class="name">หวยรวยทรัพย์99</div>
      <div class="desc">ยินดีให้บริการ 24 ชั่วโมง</div>
    </div>
  </div>
  <div class="btn-wrap">
    <button class="primary-btn" type="button">เริ่มแชทกับเจ้าหน้าที่</button>
  </div>
  <div class="section">
    <div class="section-title">ช่องทางติดต่อ</div>
    <div class="list-item"><span>💬 แชทสด</span><span class="arrow">›</span></div>
    <div class="list-item"><span>📱 Line Official</span><span class="arrow">›</span></div>
    <div class="list-item"><span>📞 โทรศัพท์</span><span class="arrow">›</span></div>
    <div class="list-item"><span>❓ คำถามที่พบบ่อย</span><span class="arrow">›</span></div>
  </div>
</body>
</html>
